<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dancing Points VR app icon: three tracked points (head + hands) of a dancer -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35245a"/>
      <stop offset="1" stop-color="#0a0c1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- stage floor line and calibration ring -->
  <ellipse cx="256" cy="430" rx="150" ry="22" fill="none" stroke="#4cc9f0" stroke-width="8" opacity="0.7"/>
  <!-- body lines: head -> hands -->
  <g stroke="#ffd166" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M256 150 L140 236"/>
    <path d="M256 150 L392 122"/>
    <path d="M256 150 L256 300"/>
    <path d="M256 300 L190 405"/>
    <path d="M256 300 L322 405"/>
  </g>
  <!-- the three tracked points -->
  <circle cx="256" cy="120" r="52" fill="#4cc9f0"/>
  <circle cx="132" cy="244" r="30" fill="#ffd166"/>
  <circle cx="400" cy="114" r="30" fill="#ffd166"/>
  <!-- musical accent -->
  <path d="M430 300 v-90 l40 -12 v90" fill="none" stroke="#f4f6ff" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="418" cy="304" r="16" fill="#f4f6ff"/>
  <circle cx="458" cy="292" r="16" fill="#f4f6ff"/>
</svg>
