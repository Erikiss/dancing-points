<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c1e">
  <meta name="description" content="Dancing Points VR – Tanzspiel für Meta Quest 2 (WebXR)">
  <title>Dancing Points VR</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0c1e; color: #f4f6ff; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 30%, rgba(53, 36, 90, 0.85), rgba(10, 12, 30, 0.96)); z-index: 10; text-align: center; padding: 24px; box-sizing: border-box; }
    #overlay h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 56px); letter-spacing: 0.02em; color: #4cc9f0; }
    #overlay p { margin: 0; max-width: 40em; color: #aab3d6; line-height: 1.5; }
    #overlay button { font: inherit; font-size: clamp(20px, 3.5vw, 30px); font-weight: 700; padding: 18px 42px; border-radius: 16px; border: 3px solid transparent; cursor: pointer; min-width: 16em; }
    #btn-vr { background: #4cc9f0; color: #08111f; }
    #btn-vr:disabled { background: #2a3358; color: #6f7aa0; cursor: not-allowed; }
    #btn-emu { background: #3a4468; color: #f4f6ff; }
    #overlay button:focus-visible { border-color: #ffd166; outline: none; }
    #status { min-height: 1.5em; color: #ffd166; }
    #version { position: absolute; bottom: 12px; right: 16px; font-size: 13px; color: #6f7aa0; }
    noscript { color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Dancing Points VR</h1>
    <p>Stell dich auf die Markierung, tanz dem Trainer nach und sammle Punkte. Für die Meta Quest 2 im Quest-Browser – oder zum Testen am PC.</p>
    <button id="btn-vr" type="button" disabled>VR starten</button>
    <button id="btn-emu" type="button">Am PC testen</button>
    <div id="status">Lade …</div>
    <div id="version"></div>
    <noscript>JavaScript wird benötigt.</noscript>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
