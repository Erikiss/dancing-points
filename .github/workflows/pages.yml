# pages.yml - publish the static WebXR app (webxr/) to GitHub Pages. The int8 models (~85 MB in
# two files) stay under the 100 MB per-file limit; the site is served over HTTPS, which WebXR
# requires. Without a LAN server the app runs fully offline (results in localStorage; the duo
# online mode needs `?server=` pointing at server/server.js).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webxr
      - id: deployment
        uses: actions/deploy-pages@v4
